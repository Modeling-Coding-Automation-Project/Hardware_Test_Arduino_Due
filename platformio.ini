; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = due

[env]
platform = atmelsam
board = due
framework = arduino

build_flags =
  -I ./lib
  -I ./lib/eigen/Eigen
  -I ./lib/python_mpc_to_cpp/python_mpc
  -I ./lib/python_mpc_to_cpp/mpc_utility
  -I ./lib/python_optimization_to_cpp/optimization_utility
  -I ./lib/python_optimization_to_cpp/python_optimization
  -I ./lib/python_control_to_cpp/python_control
  -I ./lib/python_numpy_to_cpp/base_matrix
  -I ./lib/python_numpy_to_cpp/python_numpy
  -I ./lib/python_math_to_cpp/base_math
  -I ./lib/python_math_to_cpp/python_math
  -I ./lib/base_utility_cpp/base_utility
  -I ./src
  -I ./src/Timer
  -I ./src/Controller
  -I ./src/Tester
  -I ./include
  -I ./include/Timer
  -I ./include/Controller
  -I ./include/Tester
  -I ./include/Tester/mpc/lti_mpc
  -I ./include/Tester/mpc/lti_mpc_no_constraints

custom_test_define = HARDWARE_TEST_LTI_MPC
custom_tester_source = Tester/PythonMPC_Tester.cpp

build_src_flags = -D ${this.custom_test_define}
build_src_filter =
  +<*>
  -<Tester/>
  +<${this.custom_tester_source}>

[env:due]
; Uses the LTI MPC tester configured in [env].

[env:base_utility_copy]
custom_test_define = HARDWARE_TEST_BASE_UTILITY_COPY
custom_tester_source = Tester/BaseUtilityTester.cpp

[env:math_sqrt]
custom_test_define = HARDWARE_TEST_MATH_SQRT
custom_tester_source = Tester/PythonMathTester.cpp

[env:math_exp]
custom_test_define = HARDWARE_TEST_MATH_EXP
custom_tester_source = Tester/PythonMathTester.cpp

[env:math_log]
custom_test_define = HARDWARE_TEST_MATH_LOG
custom_tester_source = Tester/PythonMathTester.cpp

[env:math_trigonometric]
custom_test_define = HARDWARE_TEST_MATH_TRIGONOMETRIC
custom_tester_source = Tester/PythonMathTester.cpp

[env:math_sincos]
custom_test_define = HARDWARE_TEST_MATH_SINCOS
custom_tester_source = Tester/PythonMathTester.cpp

[env:numpy_arithmetic]
custom_test_define = HARDWARE_TEST_NUMPY_ARITHMETIC
custom_tester_source = Tester/PythonNumpyTester.cpp

[env:numpy_linalg]
custom_test_define = HARDWARE_TEST_NUMPY_LINALG
custom_tester_source = Tester/PythonNumpyLinalgTester.cpp

[env:control_ls]
custom_test_define = HARDWARE_TEST_CONTROL_LS
custom_tester_source = Tester/PythonControlTester.cpp

[env:control_rls]
custom_test_define = HARDWARE_TEST_CONTROL_RLS
custom_tester_source = Tester/PythonControlTester.cpp
